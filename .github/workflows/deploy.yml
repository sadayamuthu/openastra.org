name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The ocbc and oebc repos send this after publishing a new baseline-* release.
  repository_dispatch:
    types: [catalog-published]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fix SPA routing (copy index.html to 404.html)
        run: cp dist/index.html dist/404.html

      - name: Fetch latest catalogs from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-catalogs.sh dist

      - name: Write CNAME file
        run: echo "openastra.org" > dist/CNAME

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Keep a single commit on gh-pages; the catalogs would otherwise add ~35 MB to its history on every deploy.
          force_orphan: true
